name: Infrastructure insight

on:
  pull_request:
    paths:
      - "infra/**"
      - "app/**"
      - "scripts/**"
      - ".github/workflows/infra-insight.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Start LocalStack
        run: |
          npm install -g @localstack/lstk
          lstk setup aws
          lstk start

      - name: Plan, inspect, and deploy
        run: |
          terraform -chdir=infra init -input=false
          terraform -chdir=infra plan -input=false -out=tfplan
          terraform -chdir=infra show -json tfplan > plan.json
          python3 scripts/generate_insight.py --plan plan.json --output insight.json
          terraform -chdir=infra apply -input=false -auto-approve tfplan

      - name: Comment on PR
        if: always() && hashFiles('insight.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const i = JSON.parse(fs.readFileSync('insight.json', 'utf8'));
            const findings = i.findings.map(f => `- **${f.severity} ${f.id}**: ${f.message} Suggested action: ${f.recommendation}`).join('\n') || 'No configured checks triggered.';
            const body = `## Infrastructure insight: ${i.status}\n\n${i.summary}\n\nChanged resources: ${i.change_count}\n\n${findings}\n\n**Agent action:** ${i.agent_instruction}\n\n<sub>Heuristic demo based on Terraform plan; not a full security audit.</sub>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const old = comments.data.find(c => c.user.type === 'Bot' && c.body.includes('Infrastructure insight:'));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('insight.json') != ''
        with:
          name: infrastructure-insight
          path: insight.json
