name: Ephemeral infrastructure insight

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["infra/**", "app/**", "scripts/**", "docker-compose.yml", ".github/workflows/infra-insight.yml"]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview-and-inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      # Invoke the supported ephemeral startup action directly. The
      # LocalStack wrapper uses dynamic-uses internally; direct invocation
      # avoids that path for this private repository.
      #
      # The startup action expects a pr-id artifact, so create it explicitly.
      - name: Prepare PR ID for LocalStack preview
        run: echo "${{ github.event.pull_request.number }}" > pr-id.txt

      - name: Upload PR ID
        uses: actions/upload-artifact@v4
        with:
          name: pr-id
          path: pr-id.txt

      - name: Provision and inspect in LocalStack Cloud
        id: localstack-preview
        uses: LocalStack/setup-localstack/ephemeral/startup@v0.3.2
        with:
          # Empty token skips the nested PR-comment preparation step.
          # Our workflow posts the infrastructure insight separately below.
          github-token: ""
          localstack-api-key: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          preview-cmd: ./scripts/preview.sh
          lifetime: "30"
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      - name: Comment insight on PR
        if: always() && hashFiles('insight.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const i = JSON.parse(fs.readFileSync('insight.json','utf8'));
            const details = i.findings.length ? i.findings.map(f => `- **${f.severity.toUpperCase()} ${f.id}** (${f.resource})\n  ${f.message}\n  **Suggested action:** ${f.recommendation}`).join('\n') : 'No configured security rules were triggered.';
            const body = `${i.status === 'clear' ? '✅' : '⚠️'} **Infrastructure insight: ${i.status}**\n\n${i.summary}\n\n- Changed resources: ${i.change_count}\n\n${details}\n\n**For a developer or coding agent:** ${i.agent_instruction}\n\n<sub>Generated from a LocalStack Cloud ephemeral instance and Terraform plan. Heuristic demo, not a complete security audit.</sub>`;
            const {owner,repo} = context.repo, issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({owner,repo,issue_number});
            const prior = comments.data.find(c => c.user.type === 'Bot' && c.body.includes('Infrastructure insight:'));
            if (prior) await github.rest.issues.updateComment({owner,repo,comment_id:prior.id,body});
            else await github.rest.issues.createComment({owner,repo,issue_number,body});

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('insight.json') != ''
        with:
          name: infrastructure-insight
          path: insight.json
