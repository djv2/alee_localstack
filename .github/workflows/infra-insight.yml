name: Ephemeral infrastructure insight
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["infra/**", "app/**", "scripts/**", "docker-compose.yml", ".github/workflows/infra-insight.yml"]
permissions:
  contents: read
  pull-requests: write
jobs:
  preview-and-inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ github.event.pull_request.head.sha }} }
      - name: Start temporary LocalStack
        run: docker compose up -d
      - name: Wait for LocalStack
        run: |
          for attempt in $(seq 1 60); do
            curl -fsS http://localhost:4566/_localstack/health >/dev/null && exit 0
            sleep 2
          done
          docker compose logs; exit 1
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.8.5 }
      - name: Plan and deploy to LocalStack
        working-directory: infra
        env: { AWS_ACCESS_KEY_ID: test, AWS_SECRET_ACCESS_KEY: test, AWS_DEFAULT_REGION: us-east-1 }
        run: |
          terraform init -input=false
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan > ../plan.json
          terraform apply -input=false -auto-approve tfplan
      - name: Generate insight
        run: python3 scripts/generate_insight.py --plan plan.json --output insight.json
      - name: Comment insight on PR
        if: always() && hashFiles('insight.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const i = JSON.parse(fs.readFileSync('insight.json','utf8'));
            const details = i.findings.length ? i.findings.map(f => `- **${f.severity.toUpperCase()} ${f.id}** (${f.resource})\n  ${f.message}\n  **Suggested action:** ${f.recommendation}`).join('\n') : 'No configured security rules were triggered.';
            const body = `${i.status === 'clear' ? '✅' : '⚠️'} **Infrastructure insight: ${i.status}**\n\n${i.summary}\n\n- Changed resources: ${i.change_count}\n\n${details}\n\n**For a developer or coding agent:** ${i.agent_instruction}\n\n<sub>Generated from an ephemeral LocalStack/Terraform plan. Heuristic demo, not a complete security audit.</sub>`;
            const {owner,repo} = context.repo, issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({owner,repo,issue_number});
            const prior = comments.data.find(c => c.user.type === 'Bot' && c.body.includes('Infrastructure insight:'));
            if (prior) await github.rest.issues.updateComment({owner,repo,comment_id:prior.id,body});
            else await github.rest.issues.createComment({owner,repo,issue_number,body});
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('insight.json') != ''
        with: { name: infrastructure-insight, path: insight.json }
      - name: Tear down temporary environment
        if: always()
        run: docker compose down -v
